name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  # write: create the GitHub Release after publishing
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: node --test "test/*.test.js"

      # No NODE_AUTH_TOKEN: OIDC handles auth, and provenance is generated
      # automatically when publishing from a trusted publisher.
      - name: Publish to npm
        run: npm publish --access public

      # The release notes are this version's CHANGELOG section, so the Releases
      # page and npm never disagree. Relative links are made absolute because
      # they do not resolve on the Releases page.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md \
            | sed -e "s#](docs/#](https://github.com/$REPO/blob/$TAG/docs/#g" -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section. Package is published; add the section and create the release by hand."
            exit 1
          fi
          printf '\n---\n\nnpm: [n8n-nodes-zalo-platform@%s](https://www.npmjs.com/package/n8n-nodes-zalo-platform/v/%s)\n' "$VERSION" "$VERSION" >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
